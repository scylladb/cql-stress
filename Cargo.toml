[package]
edition = "2021"
name = "cql-stress"
version = "0.2.4"
rust-version = "1.89.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "cql-stress-cassandra-stress"
path = "src/bin/cql-stress-cassandra-stress/main.rs"

[[bin]]
name = "cql-stress-scylla-bench"
path = "src/bin/cql-stress-scylla-bench/main.rs"

[profile.release]
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
lto = true
opt-level = 3
overflow-checks = false
debug = false
strip = true
debug-assertions = false

[profile.dev-opt]
inherits = "dev"
opt-level = 2

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22"
chrono = "0.4.44"
futures = "0.3.32"
hdrhistogram = "7.5.4"
lazy_static = "1.5.0"
java_random = "0.1.7"
openssl = "0.10.80"
parking_lot = "0.12.5"
rand = "0.10"
rand_distr = "0.6"
rand_pcg = "0.10"
regex = "1.12.3"
# Leader-aware routing for strongly consistent (Raft-per-tablet) tables arrived in 1.9.0
# (scylla-rust-driver #1788 / #1887); it is in no earlier release. The API it is read through -
# `cluster::metadata::ConsistencyMode` and `Keyspace::consistency_mode` - is public only behind
# the crate's `unstable-strong-consistency` feature *and* `--cfg scylla_unstable`, so it is not
# enabled here: see the `strong-consistency` feature below.
scylla = { version = "1.9.0", features = ["openssl-010"] }
sha2 = "0.11"
strum = "0.28.0"
strum_macros = "0.28.0"
thread_local = "1.1.9"
# NOTE: tokio pinning removed - regression in https://github.com/tokio-rs/tokio/issues/7744 has been resolved
tokio = { version = "1.52.3", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "fs",
    "signal",
] }
tokio-timerfd = { version = "0.2.0", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust-strictmath = "0.1.2"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_yaml = { version = "0.9", optional = true }
# Not optional: coordinator accounting identifies nodes by `Node::host_id`, which is a
# `uuid::Uuid`, and that is unconditional. Unifies with the driver's own uuid dependency.
uuid = "1.23"

[build-dependencies]
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde_json = "1.0"
chrono = "0.4.44"
cargo-lock = "11.0.1"
git2 = "0.21"

[features]
default = ["user-profile"]
user-profile = ["dep:serde", "dep:serde_yaml"]
timerfd = ["dep:tokio-timerfd"]
# Drive strongly consistent (Raft-per-tablet) keyspaces and verify that a run really routed to
# tablet Raft leaders. OFF by default and deliberately so: it turns on an unstable driver API
# whose shape the driver has not frozen, and the binary SCT runs day to day must not depend on
# that. A build without it refuses `-schema replication(consistency=...)` at parse time rather
# than emitting the DDL it cannot verify.
#
# The feature alone is not enough - the driver also gates the API on `--cfg scylla_unstable`,
# which `.cargo/config.toml` supplies. A cargo feature cannot set RUSTFLAGS, so anything that
# overrides RUSTFLAGS has to repeat that cfg; forgetting it is a compile error, never a
# silently unverified run.
strong-consistency = ["scylla/unstable-strong-consistency"]

[dev-dependencies]
ntest = "0.9"
num-bigint = "0.4"
bigdecimal = "0.4"
# Feature-unified with the `[dependencies]` entry above, so `unstable-strong-consistency` must
# not be listed here: doing so would switch it on for every test build regardless of whether
# the `strong-consistency` feature was asked for.
scylla = { version = "1.9.0", features = [
    "openssl-010",
    "num-bigint-04",
    "bigdecimal-04",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fetch_extended_version_info)',
] }
