name: Docker Build

on:
  workflow_call:
    inputs:
      version:
        default: "dev"
        required: false
        type: string
      image:
        description: "Docker Hub repository to push to"
        default: "scylladb/cql-stress"
        required: false
        type: string
      push_latest:
        description: "Also move the :latest tag to this build"
        default: true
        required: false
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true

  workflow_dispatch:
    inputs:
      version:
        default: ""
        required: true
        type: string
      image:
        description: "Docker Hub repository to push to (forks: <your user>/cql-stress)"
        default: "scylladb/cql-stress"
        required: false
        type: string
      push_latest:
        description: "Also move the :latest tag to this build"
        default: true
        required: false
        type: boolean

# The image repository is an input so a fork can build and push its own multi-arch image
# (e.g. for an SCT run against an unreleased branch) with its own Docker Hub secrets.
env:
  IMAGE: ${{ inputs.image }}

jobs:
  build-image:
    name: Build ${{ matrix.build.platform }}
    runs-on: ubuntu-24.04${{ matrix.build.platform == 'linux/arm64/v8' && '-arm' || '' }}
    strategy:
      matrix:
        build:
          - platform: linux/amd64
            arch_short: amd
          - platform: linux/arm64/v8
            arch_short: arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Build and Cache Image for the ${{ matrix.build.platform }} platform
        run: |
          docker buildx build \
            -t "$IMAGE" \
            --platform ${{ matrix.build.platform }} \
            --provenance false \
            --metadata-file metadata \
            --output push-by-digest=true,type=image,push=true \
            .
          echo "Metadata file info:"
          cat metadata
          CURRENT_SHA=$(grep -oP '"containerimage.digest": *"\Ksha256:[a-f0-9]+' metadata)
          echo CURRENT_SHA=$CURRENT_SHA
          echo $CURRENT_SHA > digest-${{ matrix.build.arch_short }}

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.build.arch_short }}
          path: digest-${{ matrix.build.arch_short }}

  push-images:
    name: Push Multiarch Images
    needs: build-image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Download Digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests

      - name: Create Multi-Arch Manifest and Push
        run: |
          ls -Rl digests
          SHA_AMD=$(cat digests/digest-amd/digest-amd)
          SHA_ARM=$(cat digests/digest-arm/digest-arm)
          echo SHA_AMD=$SHA_AMD
          echo SHA_ARM=$SHA_ARM
          docker manifest create "$IMAGE:${{ inputs.version }}" \
            --amend "$IMAGE@$SHA_AMD" \
            --amend "$IMAGE@$SHA_ARM"
          docker manifest push "$IMAGE:${{ inputs.version }}"
          docker manifest inspect "$IMAGE:${{ inputs.version }}"

      - name: Move the latest tag
        if: ${{ inputs.push_latest }}
        run: |
          SHA_AMD=$(cat digests/digest-amd/digest-amd)
          SHA_ARM=$(cat digests/digest-arm/digest-arm)
          docker manifest create "$IMAGE:latest" \
            --amend "$IMAGE@$SHA_AMD" \
            --amend "$IMAGE@$SHA_ARM"
          docker manifest push "$IMAGE:latest"
          docker manifest inspect "$IMAGE:latest"
